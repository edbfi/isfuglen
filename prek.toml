# prek.toml — pre-commit hooks configuration
# Docs: https://prek.j178.dev/configuration/
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.4.0"
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]
default_stages = ["pre-commit", "manual"]

# Keep supplied brand assets and reference rules unchanged by whitespace fixers.
# Builtin hooks — fast, offline, Rust-native
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"], exclude = { glob = ["LICENSE", ".agents/**", "public/brand/**", "src/assets/brand/**", "dist/**", "node_modules/**", ".astro/**", ".gjc/**", "bun.lock"] } },
  { id = "end-of-file-fixer", exclude = { glob = ["LICENSE", ".agents/**", "public/brand/**", "src/assets/brand/**", "dist/**", "node_modules/**", ".astro/**", ".gjc/**", "bun.lock"] } },
  { id = "mixed-line-ending", args = ["--fix=lf"], exclude = { glob = ["LICENSE", ".agents/**", "public/brand/**", "src/assets/brand/**", "dist/**", "node_modules/**", ".astro/**", ".gjc/**", "bun.lock"] } },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=512"] },
  { id = "detect-private-key" },
  { id = "check-json", exclude = { glob = ["tsconfig.json", ".vscode/**"] } },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "no-commit-to-branch", args = ["--branch", "main"] },
]

# Conventional Commits — enforce Conventional Commit message format
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [
  { id = "conventional-pre-commit", stages = ["commit-msg"] },
]

# Secret / credential leak guard — fixtures and dotfiles must never carry tokens
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks", groups = ["ci"] },
]

# Project-specific builtin checks — preserve syntax and stack conventions
[[repos]]
repo = "builtin"
hooks = [
  { id = "fix-byte-order-marker" },
  { id = "check-illegal-windows-names" },
  { id = "forbid-new-submodules" },
  { id = "check-json5", types = ["file"], files = { glob = ["tsconfig.json", ".vscode/*.json"] } },
  { id = "deny-pattern", alias = "no-npm", name = "Bun only (no npm / pnpm / yarn / npx)", args = ["(^|[^=])\\b(npm|pnpm|yarn|npx)\\s"], files = "^(package\\.json|bunfig\\.toml|Dockerfile|\\.github/workflows/.*\\.ya?ml|scripts/.*\\.(sh|ts|mjs))$" },
  { id = "deny-pattern", alias = "no-svelte4", name = "Svelte 5 runes only (no export let / on: / $:)", args = ["^\\s*export\\s+let\\s", "\\son:[a-zA-Z]+=", "^\\s*\\$:\\s"], files = "\\.svelte$" },
  { id = "deny-pattern", alias = "no-stale-uno-preset", name = "UnoCSS presetWind4 only", args = ["presetUno", "presetWind3"], files = "^uno\\.config\\.ts$" },
  { id = "deny-pattern", alias = "no-astro-glob", name = "No removed Astro.glob()", args = ["Astro\\.glob\\("], files = "\\.(astro|ts)$" },
  { id = "deny-pattern", alias = "client-only-needs-framework", name = "client:only must name its framework", args = ["client:only[\\s/>]"], files = "\\.astro$" },
  { id = "deny-pattern", alias = "no-dynamic-classes", name = "No dynamically constructed UnoCSS class names", args = ["class=\\{`[^`]*[-a-zA-Z0-9]\\$\\{", "class=\\{`[^`]*\\$\\{[^`}]*\\}[-a-zA-Z0-9]", "class=\"[^\"]*[-a-zA-Z0-9]\\{", "class=\"[^\"]*\\{[^\"}]*\\}[-a-zA-Z0-9]"], files = "\\.(astro|svelte)$" },
]

# Local hooks — project-specific quality gates
[[repos]]
repo = "local"
hooks = [
  { id = "biome", name = "Format and lint with Biome", entry = "bunx --bun biome check --write --files-ignore-unknown=true --no-errors-on-unmatched", language = "system", groups = ["ci"], types = ["text"], files = "\\.(js|mjs|cjs|ts|jsx|tsx|json|jsonc|css|astro|svelte)$" },
  { id = "astro-check", name = "Type check Astro and Svelte", entry = "bun run check", language = "system", pass_filenames = false, stages = ["pre-push"], groups = ["ci", "slow"] },
  { id = "tests", name = "Run test suite", entry = "bun test", language = "system", pass_filenames = false, stages = ["pre-push"], groups = ["ci", "slow"] },
  { id = "build", name = "Build the static site", entry = "bun run build", language = "system", pass_filenames = false, always_run = true, stages = ["manual"], groups = ["ci", "slow"] },
]

# Config audit — manual only
[[repos]]
repo = "meta"
hooks = [
  { id = "check-useless-excludes", stages = ["manual"], groups = ["ci"] },
]
