# Publish the built static site to GitHub Pages at https://isfugl.edb.fi.
#
# The app is `output: "static"` with no adapter, no SSR and no API route, so the
# deployable artefact is exactly `dist/`. peaceiris/actions-gh-pages force-pushes
# that directory to the `gh-pages` branch and writes the CNAME file on every run,
# which is why the custom domain survives a redeploy instead of being reset.
#
# Successful default-branch CI triggers this publisher for the exact main commit.
# The revision and final CI are checked before publication.
name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected-default-sha:
        description: Exact default-branch commit to publish; empty uses current main
        type: string
        default: ''

# The default GITHUB_TOKEN needs write access to push the `gh-pages` branch.
permissions:
  contents: write
  actions: read

# Never cancel a deploy in flight: the publish step force-pushes a branch, and
# killing it mid-push is the one way to leave the site in a torn state. Queued
# runs are serialised instead.
concurrency:
  group: deploy-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: https://isfugl.edb.fi
    steps:
      - name: Checkout current deployment revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Require successful CI for this exact default commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/deployment.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          # Derived from the committed `packageManager` field, not `latest`:
          # a deploy must build with the same toolchain the gates validated.
          bun-version-file: package.json

      # `--frozen-lockfile` so a deploy can never resolve a dependency version
      # that no pull request ever tested.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Recheck current revision and CI before publication
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CI_RUN_ID: ${{ steps.ci.outputs.run-id }}
          EXPECTED_CI_ATTEMPT: ${{ steps.ci.outputs.run-attempt }}
        run: python3 .github/scripts/deployment.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Astro emits `_astro/`, and Jekyll drops underscore-prefixed paths.
          # The action writes `.nojekyll` for us as long as Jekyll stays off.
          enable_jekyll: false
          cname: isfugl.edb.fi
